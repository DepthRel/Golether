<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Golether rendezvous server icon: the Golether TV, smaller, with a server rack badge in the corner.
    Raster versions: Scripts/Assets/generate-icon.ps1 -Server
  -->
  <defs>
    <linearGradient id="amber" x1="112" y1="232" x2="912" y2="812" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6BE82"/>
      <stop offset="1" stop-color="#E08E3C"/>
    </linearGradient>
    <linearGradient id="teal" x1="312" y1="356" x2="712" y2="756" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FD1C4"/>
      <stop offset="1" stop-color="#3C9A8D"/>
    </linearGradient>
    <linearGradient id="frame" x1="584" y1="584" x2="992" y2="992" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6BE82"/>
      <stop offset="1" stop-color="#E08E3C"/>
    </linearGradient>
    <linearGradient id="rack" x1="628" y1="624" x2="948" y2="952" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7FD1C4"/>
      <stop offset="1" stop-color="#3C9A8D"/>
    </linearGradient>
    <clipPath id="screen">
      <rect x="168" y="288" width="688" height="468" rx="64"/>
    </clipPath>
    <!-- The transparent gap between the TV and the badge. -->
    <mask id="gap" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <rect x="556" y="556" width="464" height="464" rx="116" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#gap)">
    <g transform="translate(8 48) scale(0.78)">
      <g stroke="#EDA35A" stroke-width="40" stroke-linecap="round" fill="none">
        <path d="M512 232 L380 96 M512 232 L644 96"/>
        <path d="M300 800 L270 900 M724 800 L754 900"/>
      </g>
      <rect x="112" y="232" width="800" height="580" rx="110" fill="url(#amber)"/>
      <rect x="168" y="288" width="688" height="468" rx="64" fill="#0C1315"/>
      <g clip-path="url(#screen)" fill="url(#teal)">
        <circle cx="512" cy="452" r="96"/>
        <ellipse cx="512" cy="768" rx="200" ry="180"/>
      </g>
    </g>
  </g>
  <rect x="584" y="584" width="408" height="408" rx="88" fill="url(#frame)"/>
  <rect x="604" y="604" width="368" height="368" rx="72" fill="#0C1315"/>
  <g>
    <rect x="628" y="624" width="320" height="96" rx="22" fill="url(#rack)"/>
    <rect x="628" y="740" width="320" height="96" rx="22" fill="url(#rack)"/>
    <rect x="628" y="856" width="320" height="96" rx="22" fill="url(#rack)"/>
    <g fill="#0C1315">
      <rect x="664" y="664" width="136" height="16" rx="8"/>
      <rect x="664" y="780" width="136" height="16" rx="8"/>
      <rect x="664" y="896" width="136" height="16" rx="8"/>
    </g>
    <g fill="#F6BE82">
      <circle cx="890" cy="672" r="18"/>
      <circle cx="890" cy="788" r="18"/>
      <circle cx="890" cy="904" r="18"/>
    </g>
  </g>
</svg>
